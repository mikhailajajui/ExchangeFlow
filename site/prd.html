<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Branch Desk PRD</title>
  <link rel="stylesheet" href="../site.css">
</head>
<body>
  <header class="bar"><a class="brand" href="../">Exchange<span class="flow">Flow</span></a><span class="sub">Branch Desk requirements</span><span class="sp"></span><a href="../prototype/">Prototype</a></header>
  <main class="wrap doc" id="doc"><p>Loading the requirements…</p></main>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
  <script>
    // Renders branch-desk-prd.md (copied next to this page at build time). Relative links point back to GitHub.
    const REPO = 'https://github.com/mikhailajajui/ExchangeFlow/blob/main/docs/';
    (async () => {
      const el = document.getElementById('doc');
      try {
        const md = await (await fetch('branch-desk-prd.md', { cache: 'no-cache' })).text();
        el.innerHTML = marked.parse(md);
        // GitHub-style heading ids, so in-document links such as #9-questions-for-stakeholders work.
        el.querySelectorAll('h1,h2,h3,h4').forEach(h => { h.id = h.textContent.trim().toLowerCase().replace(/[^\w\- ]/g, '').replace(/ /g, '-'); });
        el.querySelectorAll('a[href]').forEach(a => {
          const h = a.getAttribute('href');
          if (!/^(https?:|#|mailto:)/.test(h)) a.href = new URL(h, REPO).href;
        });
        el.querySelectorAll('pre > code.language-mermaid').forEach(code => {
          const div = document.createElement('div'); div.className = 'mermaid'; div.textContent = code.textContent;
          code.parentElement.replaceWith(div);
        });
        const dark = matchMedia('(prefers-color-scheme: dark)').matches;
        mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'default' });
        await mermaid.run({ querySelector: '.mermaid' });
        if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
      } catch (e) {
        el.innerHTML = '<p>The requirements could not be loaded. Read them on <a href="' + REPO + 'branch-desk-prd.md">GitHub</a>.</p>';
      }
    })();
  </script>
</body>
</html>
